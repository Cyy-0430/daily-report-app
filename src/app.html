<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>日报生成</title>
    <!-- 启动闪屏:全内联样式,HTML 一解析就绘制、不等 JS bundle,消除冷启动白屏。
         应用挂载后由 +layout.svelte 移除。颜色与 src/app.css 的 --paper/--accent 同步维护。 -->
    <style>
      body {
        margin: 0;
        background-color: #f3eee3;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      #app-splash .mark {
        width: 13px;
        height: 13px;
        background: #9c3a26;
        border-radius: 3px;
        transform: rotate(45deg);
        box-shadow: 0 0 0 3px rgba(156, 58, 38, 0.12);
        animation: app-splash-pulse 1.1s ease-in-out infinite;
      }
      #app-splash .name {
        font-family: ui-monospace, Consolas, monospace;
        font-weight: 700;
        letter-spacing: 0.2em;
        font-size: 0.85rem;
        color: #1f1c18;
        display: flex;
        align-items: baseline;
        gap: 0.55rem;
      }
      #app-splash .name span {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        font-weight: 500;
        letter-spacing: 0.04em;
        font-size: 0.78rem;
        color: #5d564c;
      }
      @keyframes app-splash-pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app-splash" aria-hidden="true">
      <div class="mark"></div>
      <div class="name">DAILY<span>· 日报生成</span></div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
