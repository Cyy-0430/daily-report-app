name: Format Check

# 每次推送到 main 或发起 PR 时，强制检查前后端代码格式（Prettier + rustfmt）。
# 本地修复：pnpm format  与  cargo fmt --manifest-path src-tauri/Cargo.toml
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24 # svelte-awesome-color-picker engines 要求 node>=24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rustfmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
