name: Release

# 推送 v* 开头的 tag 时触发，自动构建 Windows / macOS / Linux 安装包并发布到 GitHub Release（草稿）。
# 例如: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Sync version from git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json \
            && mv tmp.json src-tauri/tauri.conf.json
          echo "=== tauri.conf.json version ==="
          jq '.version' src-tauri/tauri.conf.json

      - name: Load release notes (Release 页与 latest.json 的单一来源)
        shell: bash
        run: |
          {
            echo "RELEASE_BODY<<RELEASE_NOTES_EOF"
            # 剥掉文件顶部的 <!-- --> 使用说明注释,只保留正文
            sed '/^<!--/,/^-->/d' .github/release-notes.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_ENV"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 签名:使能 createUpdaterArtifacts 后,据此对安装包签名并生成 latest.json。
          # 私钥与密码由仓库 owner 在 GitHub Secrets 配置(见 prd「用户侧前置依赖」)。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '日报生成 v__VERSION__'
          # 内容来自 .github/release-notes.md(单一来源):tauri-action 会把它同时写进
          # Release 页与 latest.json 的 notes(应用内更新弹窗显示的内容)。
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
